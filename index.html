<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="format-detection" content="telephone=no">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>MMU 취업박람회 모바일</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
:root{--bg:#ffffff;--fg:#15171a;--g1:#5a606a;--g2:#959ba5;--line:#e3e5e9;--fill:#f3f4f6;--accent:#d4410b;--on-accent:#ffffff;--mark:#d4410b;--mk:212,65,11;--font:"IBM Plex Sans KR";--nav:#1d3a5f;--eng:#9fb6d1;--a:#3d434c;--b:#b9bec6;color-scheme:light}
:root[data-mode="dark"]{--bg:#101215;--fg:#eceef1;--g1:#a3a9b3;--g2:#6b717c;--line:#272b32;--fill:#191c21;--accent:#ff7a45;--on-accent:#101215;--nav:#a9c8ee;--eng:#4d6788;--a:#c9ced6;--b:#565c67;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.5 var(--font),-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
body.lock{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
a{color:inherit}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:40}

/* 위쪽 */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:8px;height:48px}
.brand{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{font-weight:400;color:var(--g1);font-size:12px;margin-left:6px}
.majbtn{height:32px;padding:0 10px;border:1px solid var(--line);border-radius:3px;font-size:13px;white-space:nowrap}
.majbtn b{font-weight:600}
.icbtn{width:36px;height:36px;display:grid;place-items:center;color:var(--g1)}

/* 아래 탭 */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
.ti{position:relative;display:grid}
.tb{position:absolute;left:100%;top:-3px;margin-left:-3px;font-size:10px;font-weight:600;line-height:1;color:var(--accent)}
.tb.dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
#bform{padding-bottom:6px;border-bottom:1px solid var(--line)}
#btext{display:block;width:100%;border:1px solid var(--line);border-radius:3px;background:var(--bg);color:var(--fg);padding:10px 12px;font:inherit;line-height:1.5;resize:vertical;min-height:80px}
#btext:focus{outline:0;border-color:var(--fg)}
.bbar{display:flex;align-items:center;gap:8px;margin-top:8px}
.bbar select{flex:1;min-width:0;max-width:none;border:1px solid var(--line);border-radius:3px;height:36px;padding:0 6px;color:var(--fg)}
.bbar .cnt{font-size:12px;color:var(--g1);white-space:nowrap}
.bsend{height:36px;padding:0 16px;background:var(--accent);color:var(--on-accent);border-radius:3px;font-weight:600;font-size:13.5px;white-space:nowrap}
.bsend[disabled]{opacity:.5}
.bmsg{font-size:12.5px;color:var(--accent);min-height:20px;padding-top:6px}
.post{padding:12px 0 8px;border-bottom:1px solid var(--line)}
.post .pm{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--g1);flex-wrap:wrap}
.post .pm .lk{color:var(--accent)}
.post .pb{margin:4px 0 2px;white-space:pre-wrap;overflow-wrap:anywhere}
.post .pa2{display:flex;justify-content:flex-end;font-size:12px;color:var(--g2);min-height:24px;align-items:center}
.post .pa2 button{font-size:12px;color:var(--g1);padding:4px 0 4px 12px}
.post .pa2 button[data-armed]{color:var(--accent);font-weight:600}
.mine{color:var(--accent);font-weight:600}
.vday{display:flex;gap:8px;margin-bottom:8px}
.vday button{flex:1;height:40px;border:1px solid var(--line);border-radius:3px;font-size:13.5px}
.vday button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.vgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.vgrid button{height:52px;border:1px solid var(--line);border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.vgrid button b{font-size:15px;font-weight:600}
.vgrid button small{font-size:11px;color:var(--g1)}
.vgrid button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.vgrid button[aria-pressed="true"] small{color:var(--on-accent)}
.vgrid button[disabled]{opacity:.35}
.vfoot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;min-height:32px}
.vs{display:grid;gap:4px;margin:8px 0 2px}
.vsr{display:grid;grid-template-columns:30px repeat(9,minmax(0,1fr));gap:3px;align-items:end}
.vsr>span{font-size:12px;color:var(--g1);align-self:center}
.vc{height:44px;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;border-bottom:1px solid var(--line)}
.vc b{font-size:10.5px;font-weight:600;color:var(--g1);line-height:1;text-align:center;margin-bottom:2px}
.vc i{display:block;background:var(--b)}
.vc.pk i{background:var(--accent)}
.vc.pk b{color:var(--accent)}
.vc.me i{box-shadow:inset 0 0 0 1.5px var(--fg)}
.vc.me{border-bottom-color:var(--fg)}
.vsh span{font-size:11px;color:var(--g2);text-align:center}
.vsh>span:first-child{color:transparent}
.vap span{font-size:10.5px;color:var(--g2);text-align:center;border-top:1px solid var(--line);padding-top:2px}
.vap>span:first-child{border:0}
.vlab{font-size:12px;color:var(--g1);margin:10px 0 4px}
.vmin{grid-template-columns:repeat(6,minmax(0,1fr))}
.vmin button{height:44px}
.vmin button b{font-size:13px}
.vfoot .bsend{margin-left:auto}
.vme{margin:10px 0 0;font-size:14px}
.vme b{font-weight:600}
.vt{display:flex;flex-direction:column;align-items:center;justify-content:center;width:60px;min-height:44px;line-height:1.15;color:var(--accent)}
.vt b{font-size:14px;font-weight:600}
.vt small{font-size:11px;color:var(--g1);text-align:center}
#app .frow{grid-template-columns:40px minmax(0,1fr) 60px 40px}
.fsort{display:flex;align-items:center;gap:6px;padding:10px 0 2px;font-size:12.5px;color:var(--g1)}
.fsort button{height:30px;padding:0 10px;border:1px solid var(--line);border-radius:3px;font-size:12.5px}
.fsort button[aria-pressed="true"]{border-color:var(--accent);color:var(--fg);font-weight:600}
.post .nick{color:var(--fg);font-weight:600}
button.nick{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;padding:6px 0;margin:-6px 0;touch-action:manipulation}
.post .pa2{justify-content:flex-start}
.pa2 .sp{flex:1}
.post .pa2 button.cbtn,.post .pa2 button.rbtn{padding:6px 14px 6px 0}
.post .pa2 button.cbtn{color:var(--fg)}
.post .pa2 button.cbtn[aria-expanded="true"]{color:var(--accent)}
.cbtn b{font-weight:600}
.cmts{margin:4px 0 6px;padding-left:12px;border-left:2px solid var(--line)}
.cm{padding:8px 0 0;border-top:1px solid var(--line)}
.cm:first-child{border-top:0;padding-top:2px}
.cm.re{margin-left:10px;padding-left:12px;border-top:0;border-left:1px solid var(--line)}
.cm .pb{font-size:14px}
.cm.gone .pb{color:var(--g2);font-size:13px;margin:0;padding-bottom:8px}
.at{color:var(--accent);font-weight:600}
.cnote{font-size:12.5px;color:var(--g1);padding:6px 0}
.cform{padding:8px 0 2px}
.rto{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--g1);padding-bottom:6px;flex-wrap:wrap}
.rto b{color:var(--accent);font-weight:600}
.crow2{display:flex;gap:8px;align-items:flex-end}
.ctext{flex:1;min-width:0;display:block;border:1px solid var(--line);border-radius:3px;background:var(--bg);color:var(--fg);padding:7px 10px;font:inherit;line-height:1.45;resize:none;height:38px;max-height:120px}
.ctext:focus{outline:0;border-color:var(--fg)}
.cform .bsend{height:38px}
.cform .bmsg{min-height:0;padding-top:4px}
.cform .bmsg:empty{display:none}
.bme{font-size:12.5px;color:var(--g1);padding:0 0 8px}
.bme b{color:var(--fg);font-weight:600}
#modal.top{place-items:start center}
#modal.top .panel{border-top:0;border-bottom:1px solid var(--line);padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:16px}
.fl{display:block;font-size:12px;color:var(--g1);margin:10px 0 4px}
.nrow{display:flex;gap:8px;align-items:center}
.nin{flex:1;min-width:0;width:100%;height:44px;border:1px solid var(--line);border-radius:3px;background:var(--bg);color:var(--fg);padding:0 12px;font-size:16px}
.nin:focus{outline:0;border-color:var(--fg)}
#npin{flex:none;width:118px;letter-spacing:.25em}
.nbtn{height:44px;padding:0 12px;border:1px solid var(--line);border-radius:3px;font-size:13px;white-space:nowrap;flex:none}
.nrow .bsend{height:44px;flex:1;min-width:0;text-align:center;padding:0 8px}
.panel .nnote{font-size:12px;margin:8px 0 0;line-height:1.5}
.nfoot{display:flex;align-items:center;min-height:36px;margin-top:4px}
.cph{display:flex;align-items:center;gap:12px;padding:12px 0 4px;font-size:12.5px;color:var(--g1)}
.cph b{color:var(--fg);font-weight:600;flex:1;font-size:13.5px}
.cph b span{color:var(--accent);margin-left:6px}
.cpk{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
.cpk button{display:flex;align-items:center;gap:8px;min-height:44px;padding:6px 0;font-size:13.5px;line-height:1.25;border-bottom:1px solid var(--line);min-width:0}
.cpk .bx{width:18px;height:18px;border:1.5px solid var(--g2);border-radius:2px;display:grid;place-items:center;color:transparent;flex:none}
.cpk button[aria-pressed="true"] .bx{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.cpk .bx svg{width:14px;height:14px;stroke-width:2.4}
.cpk .nm2{flex:1;min-width:0}
.cpk small{color:var(--g2);font-size:11px;flex:none}
.cpd{margin:2px 0 10px}
.cpd summary{font-size:12.5px;color:var(--accent);padding:12px 0 10px;cursor:pointer}
@media (pointer:coarse){.q input,#btext,select,.ctext{font-size:16px}}
nav.tabs button{height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;white-space:nowrap;color:var(--g1);border-top:2px solid transparent;margin-top:-1px}
nav.tabs button[aria-current="page"]{color:var(--accent);border-top-color:var(--accent);font-weight:600}
main{padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}

/* 공통 조각 */
.segs{display:flex;gap:20px;border-bottom:1px solid var(--line)}
.segs button{padding:12px 0 10px;color:var(--g1);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.segs button[aria-pressed="true"]{color:var(--fg);font-weight:600;border-bottom-color:var(--accent)}
.segs button small{color:var(--g2);font-weight:400;margin-left:4px}
.scroller{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.scroller::-webkit-scrollbar{display:none}
.scroller .segs{border-bottom:0;width:max-content}
.tools{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.q{flex:1;min-width:0;display:flex;align-items:center;gap:6px;color:var(--g2)}
.q input{flex:1;min-width:0;border:0;background:none;height:32px;outline:0;color:var(--fg)}
.q input::placeholder{color:var(--g2)}
select{border:0;background:none;height:32px;color:var(--g1);font-size:13px;max-width:44vw}
.note{font-size:12.5px;color:var(--g1);padding:8px 0;line-height:1.55}
.note b{color:var(--fg);font-weight:600}
.key{display:inline-block;width:8px;height:8px;margin-right:4px;vertical-align:1px}
.key.nav{background:var(--nav)}.key.eng{background:var(--eng)}.key.a{background:var(--a)}.key.b{background:var(--b)}
.h{font-size:13px;font-weight:600;color:var(--g1);padding:20px 0 6px;border-bottom:1px solid var(--line);letter-spacing:.01em}
.empty{padding:40px 0;color:var(--g1);text-align:center;line-height:1.7}
.txtbtn{color:var(--accent);font-size:13px;white-space:nowrap}
.code{font-size:12px;color:var(--g1);letter-spacing:.02em;white-space:nowrap}

/* 둘러보기 줄 */
ul.rows{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:minmax(0,1fr) 40px;border-bottom:1px solid var(--line)}
.row .main{display:grid;grid-template-columns:44px minmax(0,1fr) auto;row-gap:5px;padding:12px 0;align-items:baseline}
.nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.val{font-weight:600;padding-left:12px;text-align:right;white-space:nowrap}
.val.long{grid-column:2/4;padding-left:0;text-align:left;white-space:normal;font-size:14px}
.bar{grid-column:2/4;display:flex;height:6px;background:var(--fill)}
.bar i{display:block;height:100%}
.bar .nav,.cols .nav{background:var(--nav)}.bar .eng,.cols .eng{background:var(--eng)}.bar .a,.cols .a{background:var(--a)}.bar .b{background:var(--b)}
.sub{grid-column:2/4;font-size:12.5px;color:var(--g1);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.l2{grid-column:2/4;display:flex;gap:10px;align-items:flex-end;min-width:0}
.l2 .sub{flex:1;min-width:0}
.cols{display:flex;align-items:flex-end;gap:3px;height:26px;border-bottom:1px solid var(--line)}
.cols i{display:block;width:9px;min-height:1px}
.star{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--g2);min-height:44px}
.star small{font-size:10.5px;line-height:1;min-height:11px;color:var(--g1)}
.star[aria-pressed="true"]{color:var(--accent)}
.star[aria-pressed="true"] small{color:var(--accent)}
.crow a.ph{color:inherit;text-decoration:underline;text-decoration-color:var(--g2);text-underline-offset:3px;user-select:auto;-webkit-user-select:auto}
.star[aria-pressed="true"] svg{fill:var(--accent)}
.agl{grid-column:2/4;font-size:13px;color:var(--g1);line-height:1.5}
.agl b{color:var(--fg);font-weight:600}

/* 상세 */
#sheet{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#sheet{animation:none}}
.sh-top{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.sh-top .wrap{display:flex;align-items:center;gap:4px;height:52px}
.sh-top .ttl{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-body{padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.hd{padding:16px 0 12px}
.hd img.logo{display:block;max-height:36px;max-width:60%;width:auto;height:auto;margin-bottom:12px;background:#fff;padding:4px}
.hd h1{font-size:20px;line-height:1.35;margin:0 0 6px;font-weight:600}
.meta{font-size:13.5px;color:var(--g1);line-height:1.7}
.meta a{color:var(--accent);text-decoration:none}
.acts{display:flex;gap:8px;padding:4px 0 12px}
.act{flex:1;height:40px;border:1px solid var(--line);border-radius:3px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13.5px}
.act[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.act[aria-pressed="true"] .st svg{fill:var(--accent)}
dl.sum{margin:0}
.sum>div{display:grid;grid-template-columns:76px minmax(0,1fr);gap:0 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.sum dt{font-size:13px;color:var(--g1);padding-top:1px}
.sum dd{margin:0;min-width:0}
.sum .v{font-weight:600}
.sum .d{font-size:12.5px;color:var(--g1);line-height:1.5;margin-top:2px}
.sum .src{font-size:12px;color:var(--accent);margin-top:4px;display:inline-block}
details.sec{border-bottom:1px solid var(--line)}
details.sec summary{list-style:none;display:flex;align-items:center;gap:8px;padding:13px 0;cursor:pointer}
details.sec summary::-webkit-details-marker{display:none}
details.sec summary .t{flex:1;min-width:0;font-weight:600}
details.sec summary .pg{font-size:12px;color:var(--g2);white-space:nowrap}
details.sec summary svg{color:var(--g2);transform:rotate(-90deg);transition:transform .15s}
details.sec[open] summary svg{transform:rotate(90deg)}
.secb{padding:0 0 14px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);margin:6px 0 10px}
table.t{border-collapse:collapse;width:100%;font-size:12.5px;line-height:1.45}
table.t td,table.t th{border:1px solid var(--line);padding:6px 7px;vertical-align:middle;text-align:center;white-space:pre-line;min-width:44px}
table.t tr:first-child>*{border-top:0}table.t tr>*:first-child{border-left:0}table.t tr>*:last-child{border-right:0}table.t tr:last-child>*{border-bottom:0}
table.t th,table.t td.title{background:var(--fill);font-weight:600}
table.t td.l{text-align:left;min-width:150px}
table.t td img{display:block;max-width:200px;height:auto;margin:4px auto}
.subh{font-size:13px;font-weight:600;margin:10px 0 4px}
.tx{font-size:13.5px;margin:6px 0;white-space:pre-line}
figure.im{margin:8px 0}
figure.im img{display:block;width:100%;height:auto;border:1px solid var(--line);background:#fff}
figure.im figcaption{font-size:12px;color:var(--g2);padding-top:4px}
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.crow .n{font-weight:600;min-width:0}
.crow .ph{font-size:15px;letter-spacing:.01em;user-select:all;-webkit-user-select:all}
.crow .m{font-size:12px;color:var(--g1)}
.crow .cp{grid-row:1/3;grid-column:2;width:40px;height:40px;display:grid;place-items:center;color:var(--g1);border:1px solid var(--line);border-radius:3px}
.crow .lk{color:var(--accent);font-size:12px;margin-left:6px;font-weight:400;white-space:nowrap}

/* 지도 */
.plan{position:relative;border:1px solid var(--line);background:#fff;overflow:auto;-webkit-overflow-scrolling:touch}
.plan .in{position:relative;width:100%}
.plan:not(.zoom){overflow:visible}
.plan.zoom{max-height:72vh}
.plan.zoom .in{width:230%}
.plan img{display:block;width:100%;height:auto}
.hs{position:absolute;transform:translate(-50%,-50%);width:20px;height:20px;border-radius:50%;border:1.5px solid var(--mark);background:rgba(var(--mk),.08)}
.plan.zoom .hs{width:40px;height:40px;border-width:2px}
.hs.fav{background:rgba(var(--mk),.45)}
.hs.on{background:var(--mark);box-shadow:0 0 0 5px rgba(var(--mk),.3)}

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P='M4 6h16M4 12h16M4 18h10';
const IC={
 list:`<svg viewBox="0 0 24 24"><path d="${P}"/></svg>`,

 check:'<svg viewBox="0 0 24 24"><path d="M5 12.500l4.500 4.500L19 7.500"/></svg>',
 copy:'<svg viewBox="0 0 24 24"><rect x="8.500" y="8.500" width="11" height="11"/><path d="M5 15.500V4.500h11"/></svg>',

 info:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.500"/><path d="M12 11v5.500M12 7.700v.300"/></svg>',
 chat:'<svg viewBox="0 0 24 24"><path d="M4.500 5.500h15v10.500H10.500L6.500 19.500V16H4.500z"/></svg>'
};
const store={get(k,d){try{const v=localStorage.getItem('mmujf.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('mmujf.'+k,JSON.stringify(v))}catch(e){}}};

/* ---------- 즐겨찾기 등록 수: 공용 저장소 (자체 주소판에서만 켜진다. 값이 비어 있으면 꺼진 채로 지금처럼 동작) ---------- */
const HOSTED=true;
const CLOUD={url:"https://ojgsvtekeyzdhrwhdccj.supabase.co",key:"sb_publishable_MlphL4ZwUTm0_h4JJfvCfw_BPQLGybc",poll:15000};
const cloud={on:!!(CLOUD.url&&CLOUD.key),ok:false,counts:{},all:0,fail:0,at:0,v:0,board:{open:false,last:0,n:0,ct:0,cn:0},slots:{}};
const POP={k:'pop',n:'관심',full:'즐겨찾기 등록',note:'이 페이지에서 즐겨찾기한 사람 수입니다. 브라우저 기준이라 실제 사람 수와 조금 다를 수 있고, 다른 사람이 누른 것은 10~15초 안에 보입니다. 순위는 탭을 다시 누르면 새로 매겨집니다.'};
const canStore=(()=>{try{localStorage.setItem('mmujf.t','1');localStorage.removeItem('mmujf.t');return true;}catch(e){return false;}})();
function cnt(id){return cloud.counts[id]||0;}
function fcText(id){const n=cnt(id);return cloud.ok&&n?String(n):'';}
function popView(o){const n=cnt(o.id);return {v:cloud.ok?n+'명':'–',k:n,s:''};}
function popNote(){if(!cloud.ok)return cloud.fail?'등록 수를 불러오지 못했습니다. 잠시 뒤 다시 시도합니다.':'등록 수를 불러오는 중입니다…';
  const t=new Date(cloud.at);return `지금까지 ${cloud.all}명이 즐겨찾기를 남겼습니다 · ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')} 기준`;}
// 로그인 없이 이 브라우저만의 무작위 아이디를 만들어 보관한다 (이름·연락처 같은 정보는 쓰지 않는다)
let DEV=null;
function deviceId(){if(DEV)return DEV;let id=store.get('device',null);
  if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(id||'')){
    id=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16);});
    store.set('device',id);}
  return DEV=id;}
// 새 공개 키(sb_publishable_)는 apikey 머리말만 보낸다. 예전 방식의 anon 키(eyJ…)는 Authorization 도 함께 보낸다.
async function rpc(fn,body){const h={'apikey':CLOUD.key,'Content-Type':'application/json'};if(/^eyJ/.test(CLOUD.key))h.Authorization='Bearer '+CLOUD.key;
  const r=await fetch(CLOUD.url+'/rest/v1/rpc/'+fn,{method:'POST',headers:h,body:JSON.stringify(body||{})});
  if(!r.ok){let t='';try{t=(await r.text()).slice(0,140);}catch(e){}throw new Error('HTTP '+r.status+(t?' '+t:''));}return r.json();}
function applyCounts(rows){const c={};let all=0;for(const r of rows||[]){if(r.org_id==='_all')all=+r.cnt||0;else c[r.org_id]=+r.cnt||0;}
  cloud.counts=c;cloud.all=all;cloud.ok=true;cloud.fail=0;cloud.at=Date.now();paintCounts();}
// 주기적으로 받는 값: 기업별 등록 수 + 게시판 상태(열림 여부, 최근 글 번호, 글 수)
function applyPull(j){j=j||{};cloud.counts=j.counts||{};cloud.slots=j.slots||{};cloud.all=+j.all||0;cloud.v=+j.v||0;cloud.ok=true;cloud.fail=0;cloud.at=Date.now();paintCounts();
  const b=j.board||{},was=cloud.board.open;cloud.board={open:!!b.open,last:+b.last||0,n:+b.n||0,ct:+b.ct||0,cn:+b.cn||0};
  if(was!==cloud.board.open){if(!cloud.board.open&&st.tab==='board'){st.tab='browse';if(!st.org)go('browse');}else renderTabs();}
  if(cloud.board.open){const c=cloud.board;
    if(st.tab==='board'&&!st.org&&(c.last!==board.last||c.n!==board.n||c.ct!==board.ct||c.cn!==board.cn))loadBoard();
    else{const d=document.querySelector('#tabs [data-tab="board"] .tb');if(d)d.hidden=!(boardNew()&&st.tab!=='board');}}
  maybeAskNick();}
function cloudFail(e){cloud.fail++;cloud.err=(e&&e.message)||'연결 실패';const t=$('#popnote');if(t)t.textContent=popNote();const s=$('#cloudstat');if(s)s.textContent=cloudStat();}
function cloudStat(){const hm=d=>String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  if(cloud.fail)return `저장소 연결 실패 (${cloud.err})`;return cloud.ok?`저장소 연결 정상 · ${hm(new Date(cloud.at))}에 마지막으로 받음`:'저장소에 연결하는 중…';}
// 숫자만 제자리에서 바꾼다 (화면을 다시 그리지 않으므로 스크롤과 순서가 움직이지 않는다)
function paintCounts(){
  document.querySelectorAll('[data-fc]').forEach(el=>{el.textContent=fcText(el.dataset.fc);});
  document.querySelectorAll('[data-fcn]').forEach(el=>{el.textContent=cloud.ok?cnt(el.dataset.fcn)+'명':'–';});
  const mx=Math.max(1,...SHIP.map(o=>cnt(o.id)));
  document.querySelectorAll('[data-fcb]').forEach(el=>{el.style.width=(cnt(el.dataset.fcb)/mx*100).toFixed(1)+'%';});
  const t=$('#popnote');if(t)t.textContent=popNote();const s=$('#cloudstat');if(s)s.textContent=cloudStat();
  document.querySelectorAll('[data-vs]').forEach(el=>{el.innerHTML=slotsHTML(el.dataset.vs||null);});
  document.querySelectorAll('[data-vpeak]').forEach(el=>{el.textContent=peakText(el.dataset.vpeak||null);});
  document.querySelectorAll('[data-vpk]').forEach(el=>{el.textContent=peakShort(el.dataset.vpk);});
  if(panelMode==='visit'&&!$('#modal').hidden)paintPicker();}
let syncT=null,syncBusy=false,syncAgain=false;
async function rpcSync(){const vis={};for(const id of st.fav)if(st.visit[id])vis[id]=st.visit[id];
  try{return await rpc('fair_sync',{p_device:deviceId(),p_orgs:[...st.fav],p_visits:vis});}
  catch(e){if(/HTTP 40[04]/.test(e.message))return await rpc('fair_sync',{p_device:deviceId(),p_orgs:[...st.fav]});throw e;}}
// 내 즐겨찾기 목록을 저장소와 맞추고 최신 숫자를 받는다. 연달아 눌러도 0.7초 뒤 한 번만 보낸다.
function cloudSync(now){if(!cloud.on)return;clearTimeout(syncT);syncT=setTimeout(async()=>{
  if(syncBusy){syncAgain=true;return;}syncBusy=true;
  try{applyCounts(canStore?await rpcSync():await rpc('fair_counts'));}catch(e){cloudFail(e);}
  syncBusy=false;if(syncAgain){syncAgain=false;cloudSync(true);}},now?0:700);}
async function cloudPoll(force){if(!cloud.on||document.visibilityState!=='visible'||(syncBusy&&!force))return;try{applyPull(await rpc('fair_pull'));}catch(e){cloudFail(e);}}
function cloudStart(){if(!cloud.on)return;cloudPoll(true).then(()=>cloudSync(true));
  // 평소 15초, '관심' 탭이나 게시판을 보고 있을 때는 10초마다 새로 받는다. 연달아 실패하면 2분으로 늦춘다.
  const gap=()=>cloud.fail>=3?120000:(((st.tab==='browse'&&st.metric==='pop')||st.tab==='board')&&!st.org?Math.min(CLOUD.poll,10000):CLOUD.poll);
  const loop=()=>setTimeout(async()=>{await cloudPoll();loop();},gap());loop();
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&Date.now()-cloud.at>15000)cloudPoll();});}

/* ---------- 방문 예정 시간 ---------- */
const VDAYS=[[12,'11월 12일(목)'],[13,'11월 13일(금)']],VHOURS=[9,10,11,12,13,14,15,16,17],VMINS=[0,10,20,30,40,50];
const AMH=[9,10,11],PMH=[12,13,14,15,16,17];
let vpick={id:null,day:12,ap:'am',h:null,m:null,fresh:false},panelMode='';
// 저장 형식: "12-14-30" = 12일 14시 30분. 예전 형식 "12-14"는 0분으로 읽는다.
function vparse(v){if(!v)return null;const a=v.split('-').map(Number);return {d:a[0],h:a[1],m:a[2]||0};}
const h12=h=>h>12?h-12:h, apOf=h=>h<12?'오전':'오후', mm=m=>String(m).padStart(2,'0');
function vlabel(v){const p=vparse(v);return p?`${p.d}일 ${apOf(p.h)} ${h12(p.h)}:${mm(p.m)}`:'';}
function hourLabel(k){const [d,h]=k.split('-').map(Number);return `${d}일 ${apOf(h)} ${h12(h)}시`;}
const slotKey=v=>{const p=vparse(v);return p?p.d+'-'+p.h:null;};
function slotMap(id){if(id)return cloud.slots[id]||{};const m={};for(const s of Object.values(cloud.slots))for(const k in s)m[k]=(m[k]||0)+s[k];return m;}
function peakOf(m){let b=null;for(const k in m)if(m[k]>0&&(!b||m[k]>m[b]))b=k;return b;}
function peakText(id){if(!cloud.ok)return '방문 예정 시간을 불러오는 중입니다…';const m=slotMap(id),pk=peakOf(m);return pk?`가장 많이 몰리는 시간: ${hourLabel(pk)}대 (${m[pk]}명 예정)`:'아직 방문 시간을 고른 사람이 없습니다.';}
function peakShort(id){const m=slotMap(id),pk=peakOf(m);return pk?`많이 몰리는 시간 ${hourLabel(pk)}대 · ${m[pk]}명`:'';}
function pastTime(d,h,m){const n=new Date();if(n.getFullYear()!==2026||n.getMonth()!==10)return n>new Date(2026,10,14);
  const t=n.getDate()*1440+n.getHours()*60+n.getMinutes();return d*1440+h*60+m+9<t;}
const pastHour=(d,h)=>pastTime(d,h,50);
function slotsHTML(id){const m=slotMap(id),pk=peakOf(m),mx=Math.max(1,...Object.values(m)),mine=id?slotKey(st.visit[id]):null;
  return `<div class="vs">${VDAYS.map(([d])=>`<div class="vsr"><span>${d}일</span>${VHOURS.map(h=>{const k=d+'-'+h,n=m[k]||0;
    return `<div class="vc${k===pk?' pk':''}${k===mine?' me':''}" title="${hourLabel(k)}대 ${n}명"><b>${n||''}</b><i style="height:${n?Math.max(8,n/mx*70).toFixed(0):0}%"></i></div>`;}).join('')}</div>`).join('')}
    <div class="vsr vsh"><span></span>${VHOURS.map(h=>`<span>${h12(h)}</span>`).join('')}</div>
    <div class="vsr vap"><span></span><span style="grid-column:span 3">오전</span><span style="grid-column:span 6">오후 (시)</span></div></div>`;}
function vtInner(id){const p=vparse(st.visit[id]);if(!p)return '<small>시간<br>선택</small>';return `<b>${h12(p.h)}:${mm(p.m)}</b><small>${p.d}일 ${apOf(p.h)}</small>`;}
function vmeInner(id){if(!st.fav.has(id))return '즐겨찾기에 넣으면 방문할 시간을 고를 수 있습니다.';const v=st.visit[id];
  return `내 방문 예정 <b>${v?vlabel(v):'아직 고르지 않음'}</b> <button class="txtbtn" data-vpick="${id}">${v?'바꾸기':'고르기'}</button>`;}
function paintVisit(id){document.querySelectorAll(`[data-vt="${id}"]`).forEach(e=>{e.innerHTML=vtInner(id);});
  document.querySelectorAll(`[data-vme="${id}"]`).forEach(e=>{e.innerHTML=vmeInner(id);});
  if(st.tab==='fav'&&st.favSort==='time'&&!st.org){const y=window.scrollY;render();window.scrollTo(0,y);}}
function setVisit(id,val){const old=st.visit[id]||null;if(old===val)return;const ok=slotKey(old),nk=slotKey(val);
  if(cloud.ok&&ok!==nk){const s=cloud.slots[id]=cloud.slots[id]||{};if(ok)s[ok]=Math.max(0,(s[ok]||0)-1);if(nk)s[nk]=(s[nk]||0)+1;}
  if(val)st.visit[id]=val;else delete st.visit[id];store.set('visit',st.visit);paintCounts();paintVisit(id);cloudSync();}

function syncFav(id){const on=st.fav.has(id);
  document.querySelectorAll(`[data-fav="${id}"]`).forEach(b=>b.setAttribute('aria-pressed',on));
  const bo=D.booths.find(x=>x.o===id);if(bo)document.querySelectorAll(`.hs[data-spot="${bo.i}"]`).forEach(h=>h.classList.toggle('fav',on));

function cellHTML(c,tag,cls){const span=(c.rs>1?` rowspan="${c.rs}"`:'')+(c.cs>1?` colspan="${c.cs}"`:'');let k=cls||'';const t=c.t||'';if(tag==='td'&&t.length>26)k+=' l';
  let inner=esc(t);if(c.imgs)inner+=c.imgs.map(im=>`<img src="${im.src}" alt="" loading="lazy" width="${im.w}" height="${im.h}" data-zoom="${im.src}">`).join('');
  return `<${tag}${span} class="${k.trim()}">${inner}</${tag}>`;}
function tableHTML(tb,intro){
  const at=(r,c)=>tb.cells.find(x=>x.r===r&&x.c===c);let c0=at(0,0),title=0,h=1;
  if(c0){if((c0.cs||1)>=tb.cols){title=1;c0=at(1,0);}h=title+(c0?(c0.rs||1):1);}
  if(intro)h=title;
  const rows=[];for(let r=0;r<tb.rows;r++)rows.push([]);
  for(const c of tb.cells){const tag=c.r<h?'th':'td';const kv=intro&&(c.c===0||(c.c===2&&(c.cs||1)===1));rows[c.r].push(cellHTML(c,tag,kv&&tag==='td'?'title':''));}
  return `<div class="tw"><table class="t" style="min-width:${tb.cols>5?tb.cols*58:0}px">${rows.map(r=>`<tr>${r.join('')}</tr>`).join('')}</table></div>`;
}
function linkify(u){const m=u.match(/(https?:\/\/\S+|www\.\S+)/);if(!m)return esc(u);const href=m[1].startsWith('http')?m[1]:'https://'+m[1];
  return esc(u.slice(0,m.index))+`<a href="${esc(href)}" target="_blank" rel="noopener">${esc(m[1])}</a>`+esc(u.slice(m.index+m[1].length));}
function contactRow(c,withOrg){
  const meta=[c.g!=='해운선사'&&withOrg?c.g:'',c.b?(/^\d+$/.test(c.b)?`빌딩 No.${c.b}`:`위치도 ${c.b}`):'',c.z?`${c.z}구역`:'',c.r?(/층$/.test(c.r)?c.r:`${c.r}호`):'',c.note].filter(Boolean).join(' · ');
  const o=withOrg&&c.o&&ORG[c.o];

}

// 정확한 건물명 · 층 · 강의실 (책자 2쪽 현황표와 배치도 기준)
function whereOf(b){const B=D.bld[b.b];const name=B.name+(B.code?`(${B.code})`:'');
  if(/^\d/.test(b.room))return [name,floorOf(b.room),b.room+'호'];
  return b.room===B.name?[name]:[name,b.room];}
function placePop(sb){
  const pop=$('#pop');if(!pop||!sb)return;const inn=$('#planin'),plan=$('#plan');
  const W=inn.clientWidth,H=inn.getBoundingClientRect().height,pw=pop.offsetWidth,ph=pop.offsetHeight,h=D.hot[sb.room];
  if(!h){pop.classList.add('free');pop.style.left=Math.max(6,plan.scrollLeft+(plan.clientWidth-pw)/2)+'px';pop.style.top=(plan.scrollTop+8)+'px';return;}
  const mx=W*h[0]/100,my=H*(h[1]+3.2)/100,r=st.zoom?22:12;
  if(st.zoom){plan.scrollLeft=mx-plan.clientWidth/2;plan.scrollTop=my-plan.clientHeight/2;}
  const vl=plan.scrollLeft,vr=vl+plan.clientWidth;
  const left=Math.min(Math.max(mx-pw/2,vl+6),vr-pw-6);
  let top=my-r-ph-8,below=false;
  if(top<plan.scrollTop+4){top=my+r+8;below=true;}
  pop.style.left=left+'px';pop.style.top=top+'px';pop.classList.toggle('below',below);
  pop.style.setProperty('--ax',Math.min(Math.max(mx-left,14),pw-14)+'px');
}

const cmpHas=id=>id in st.cmp?!!st.cmp[id]:st.fav.has(id);

  const done=L.filter(o=>st.seen.has(o.id)).length;

  let body='';

  }else{const favS=ships.filter(o=>st.fav.has(o.id)),rest=ships.filter(o=>!st.fav.has(o.id)),nr=rest.filter(o=>cmpHas(o.id)).length;

}
async function sendPost(){const ta=$('#btext'),btn=document.querySelector('#bform .bsend');if(!ta)return;const body=ta.value.replace(/\s+/g,' ').trim();
  if(!body){board.msg=BWHY.empty;paintBoard();return;}
  if(nickOn()&&!me.nick){askNick(false,sendPost);return;}
  btn.disabled=true;board.msg='';
  try{const j=await rpc('fair_board_post',{p_device:deviceId(),p_body:body,p_org:$('#borg').value||null});
    if(j&&j.ok){ta.value='';$('#bcnt').textContent='0/200';board.msg='글을 올렸습니다.';cloud.board.last=Math.max(cloud.board.last,j.id);board.last=-1;await loadBoard();}
    else board.msg=BWHY[j&&j.reason]||'글을 올리지 못했습니다.';
  }catch(e){board.msg='글을 올리지 못했습니다. 연결을 확인하고 다시 시도해 주세요.';}
  btn.disabled=false;paintBoard();}
// 댓글 펼치기·접기: 그 글 아래에만 붙였다 뗀다 (다른 글에서 쓰던 댓글과 스크롤은 그대로)
function expandBtn(id,on){const b=document.querySelector(`[data-thread="${id}"]`);if(b)b.setAttribute('aria-expanded',on);}
function closeThread(id){board.open=board.open.filter(x=>x!==id);const e=document.querySelector(`[data-cmts="${id}"]`);if(e)e.remove();expandBtn(id,false);resig(id);}
function openThread(id){if(board.open.includes(id))return;board.open.push(id);while(board.open.length>5)closeThread(board.open[0]);
  const host=document.querySelector(`[data-post="${id}"]`);if(host&&!host.querySelector('.cmts'))host.insertAdjacentHTML('beforeend',cmtsHTML(id));
  expandBtn(id,true);const ta=document.querySelector(`[data-ctext="${id}"]`);if(ta)grow(ta);resig(id);loadThreads([id]);}
function toggleThread(id){if(board.open.includes(id))closeThread(id);else openThread(id);}
// 답글 대상 정하기: cid 가 없으면 글쓴이, 있으면 그 댓글(대댓글) 작성자를 @로 부른다
function paintRto(tid){const el=document.querySelector(`[data-rto="${tid}"]`);if(!el)return;const r=board.reply[tid];el.hidden=!r;el.innerHTML=rtoInner(tid);
  const ta=document.querySelector(`[data-ctext="${tid}"]`);if(ta)ta.placeholder=r?'답글 쓰기':'댓글 쓰기';}
function setReply(tid,root,cid){if(!board.v4)return false;const p=board.posts.find(x=>x.id===tid);if(!p)return false;
  let to=p.name;if(cid){const c=(board.th[tid]||[]).find(x=>x.id===cid);if(!c||c.gone)return false;to=c.name;}
  if(!to)return false;openThread(tid);board.reply[tid]={parent:root||null,to};paintRto(tid);return true;}
function focusComposer(tid){const ta=document.querySelector(`[data-ctext="${tid}"]`);if(!ta)return;if(document.activeElement!==ta)ta.focus();
  const r=ta.getBoundingClientRect();if(r.bottom>window.innerHeight-90||r.top<60)ta.scrollIntoView({block:'center'});}
async function sendComment(tid){const ta=document.querySelector(`[data-ctext="${tid}"]`);if(!ta)return;const body=ta.value.replace(/\s+/g,' ').trim();
  const say=t=>{board.cmsg[tid]=t;const e=document.querySelector(`[data-cmsg="${tid}"]`);if(e)e.textContent=t;};
  if(!body){say(BWHY.empty);return;}
  if(!me.nick){askNick(false,()=>sendComment(tid));return;}
  const btn=ta.closest('form').querySelector('.bsend');btn.disabled=true;say('');
  try{const r=board.reply[tid];
    const j=await rpc('fair_board_post',{p_device:deviceId(),p_body:body,p_org:null,p_thread:tid,p_parent:r?r.parent:null,p_mention:r?r.to:null});
    if(j&&j.ok){delete board.draft[tid];delete board.reply[tid];const t2=document.querySelector(`[data-ctext="${tid}"]`);if(t2){t2.value='';t2.style.height='';}
      paintRto(tid);await loadThreads([tid]);}
    else say(BWHY[j&&j.reason]||'댓글을 올리지 못했습니다.');
  }catch(e){say('댓글을 올리지 못했습니다. 연결을 확인하고 다시 시도해 주세요.');}
  if(btn.isConnected)btn.disabled=false;}
// 삭제·신고는 한 번 더 눌러야 실행된다 (잘못 누름 방지)
function disarm(){const a=board.arm;board.arm=null;clearTimeout(disarm.t);if(!a)return;const b=document.querySelector(`[data-b${a.kind}="${a.id}"]`);if(b){delete b.dataset.armed;b.textContent=ARM[a.kind][0];}}
function armed(kind,id,btn){if(armOn(kind,id)){board.arm=null;clearTimeout(disarm.t);return true;}
  disarm();board.arm={kind,id,until:Date.now()+4000};btn.dataset.armed='1';btn.textContent=ARM[kind][1];disarm.t=setTimeout(disarm,4000);return false;}
async function boardAct(kind,id,btn){
  if(!armed(kind,id,btn))return;
  try{const j=await rpc(kind==='del'?'fair_board_delete':'fair_board_report',{p_device:deviceId(),p_id:id});
    if(kind==='del'){if(j&&j.ok){board.posts=board.posts.filter(p=>p.id!==id);board.msg='지웠습니다.';}}
    else{board.reported.add(id);store.set('boardRep',[...board.reported].slice(-200));board.msg='신고했습니다.';}
  }catch(e){board.msg='처리하지 못했습니다. 잠시 뒤 다시 시도해 주세요.';}
  board.last=-1;paintBoard();loadBoard();}
// 닉네임 길게 누르기(0.45초) → 그 사람을 @로 부르는 답글 쓰기.
// 누르고 있는 동안 답글 대상을 정해 두고, 손을 뗄 때 댓글 칸으로 옮긴다 (아이폰은 손을 떼는 순간에만 자판을 띄울 수 있다).
const lp={t:null,x:0,y:0,fired:false,tid:null};
function lpFire(key){const a=key.split(':').map(x=>x?+x:null);lp.fired=true;lp.tid=a[0];
  try{if(navigator.vibrate)navigator.vibrate(12);}catch(e){}
  if(setReply(a[0],a[1],a[2])){const f=document.querySelector(`[data-cform="${a[0]}"]`);if(f){const r=f.getBoundingClientRect();if(r.bottom>window.innerHeight-70||r.top<60)f.scrollIntoView({block:'center'});}}else lp.tid=null;}
function lpStop(){clearTimeout(lp.t);lp.t=null;}
document.addEventListener('pointerdown',e=>{lpStop();lp.fired=false;const el=e.target.closest&&e.target.closest('[data-lp]');if(!el||(e.pointerType==='mouse'&&e.button!==0))return;
  const key=el.dataset.lp;lp.x=e.clientX;lp.y=e.clientY;lp.t=setTimeout(()=>{lp.t=null;lpFire(key);},450);});
document.addEventListener('pointermove',e=>{if(lp.t&&(Math.abs(e.clientX-lp.x)>10||Math.abs(e.clientY-lp.y)>10))lpStop();});
document.addEventListener('pointerup',e=>{lpStop();if(e.pointerType!=='touch'&&lp.fired&&lp.tid!=null)focusComposer(lp.tid);});
document.addEventListener('touchend',()=>{if(lp.fired&&lp.tid!=null)focusComposer(lp.tid);},{passive:true});
document.addEventListener('pointercancel',lpStop);
document.addEventListener('contextmenu',e=>{const el=e.target.closest&&e.target.closest('[data-lp]');if(!el||!board.v4)return;e.preventDefault();if(!lp.fired){lpStop();lpFire(el.dataset.lp);if(lp.tid!=null)focusComposer(lp.tid);}});
window.addEventListener('scroll',()=>{if(lp.t)lpStop();},{passive:true});

/* ---------- 틀 ---------- */
function tabList(){return TABS.filter(t=>t[0]!=='board'||cloud.board.open);}
function tabBadge(k){if(k==='fav')return `<b class="tb"${st.fav.size?'':' hidden'}>${st.fav.size||''}</b>`;
  if(k==='board')return `<b class="tb dot"${boardNew()&&st.tab!=='board'?'':' hidden'}></b>`;return '';}
function renderTabs(){$('#tabs').innerHTML=tabList().map(([k,n,ic])=>`<button data-tab="${k}"${st.tab===k?' aria-current="page"':''}><span class="ti">${IC[ic]}${tabBadge(k)}</span><span>${n}</span></button>`).join('');}
function render(){
  if(st.tab==='board'&&!cloud.board.open)st.tab='browse';
  renderTabs();$('#majlab').textContent=MAJ[maj()];
  ({browse:renderBrowse,map:renderMap,fav:renderFav,board:renderBoard,contacts:renderContacts,info:renderInfo})[st.tab]();
}
function go(h){if(location.hash==='#'+h)route();else location.hash=h;}
function route(){
  const h=(location.hash||'').slice(1);
  if(h.startsWith('o-')&&ORG[h.slice(2)]){render();openSheet(h.slice(2));return;}
  closeSheet();if(TABS.some(t=>t[0]===h))st.tab=h;render();
}
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,1600);}
function setMode(m){document.documentElement.dataset.mode=m;$('#modebtn').innerHTML=m==='dark'?IC.sun:IC.moon;store.set('mode',m);}function askMajor(first){panelMode='major';$('#modal').classList.remove('top');
  $('#panel').innerHTML=`<h2>${first?'전공을 골라 주세요':'전공 바꾸기'}</h2><p>고른 전공의 인원과 조건을 먼저 보여 줍니다. 위쪽 ‘전공’ 단추에서 언제든 바꿀 수 있습니다.</p>
  ${[['nav','항해','항해 계열 인원·조건'],['eng','기관','기관 계열 인원·조건'],['all','전체','항해와 기관을 함께']].map(([k,n,d])=>`<button class="opt" data-major="${k}" aria-pressed="${st.major===k}"><b>${n}</b><small>${d}</small></button>`).join('')}`;
  $('#modal').hidden=false;
}
function toggleSet(set,key,id){if(set.has(id))set.delete(id);else set.add(id);store.set(key,[...set]);}
function refreshSheetButtons(){document.querySelectorAll('#sheet [data-fav]').forEach(b=>b.setAttribute('aria-pressed',st.fav.has(b.dataset.fav)));document.querySelectorAll('#sheet [data-seen]').forEach(b=>b.setAttribute('aria-pressed',st.seen.has(b.dataset.seen)));}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-fav],[data-seen],[data-org],[data-tab],[data-cat],[data-metric],[data-bld],[data-spot],[data-zoomplan],[data-favview],[data-cg],[data-copy],[data-zoom],[data-close],[data-sec],[data-tomap],[data-major],[data-gomap],[data-bdel],[data-brep],[data-bmore],[data-vpick],[data-vday],[data-vap],[data-vmin],[data-vsave],[data-vhour],[data-vclear],[data-vskip],[data-favsort],[data-lp],[data-reply],[data-rcancel],[data-thread],[data-nickedit],[data-nroll],[data-nskip],[data-cmp],[data-cmpall]');
  if(!t)return;const d=t.dataset;
  if('lp' in d){if(lp.fired){lp.fired=false;if(lp.tid!=null)focusComposer(lp.tid);}else if(board.v4)toast('닉네임을 꾹 누르면 @답글을 쓸 수 있습니다');return;}
  if('reply' in d){const a=d.reply.split(':').map(x=>x?+x:null);if(setReply(a[0],a[1],a[2]))focusComposer(a[0]);return;}
  if('rcancel' in d){delete board.reply[+d.rcancel];paintRto(+d.rcancel);return;}
  if('thread' in d){toggleThread(+d.thread);return;}
  if('nickedit' in d){askNick(false);return;}
  if('nroll' in d){$('#nname').value=rollNick();$('#nmsg').textContent='';return;}
  if('nskip' in d){nickCb=null;closeModal();return;}
  if('cmp' in d){st.cmp[d.cmp]=!cmpHas(d.cmp);store.set('cmp',st.cmp);repaintFav();return;}
  if('cmpall' in d){st.cmp={};if(d.cmpall==='none')for(const o of SHIP)st.cmp[o.id]=false;store.set('cmp',st.cmp);repaintFav();return;}
  if('bdel' in d){boardAct('del',+d.bdel,t);return;}
  if('brep' in d){boardAct('rep',+d.brep,t);return;}
  if('bmore' in d){loadBoard(true);return;}
  if('gomap' in d){st.bld=d.gomap;st.spot=null;st.zoom=false;st.tab='map';go('map');window.scrollTo(0,0);return;}
  if('fav' in d){toggleSet(st.fav,'fav',d.fav);syncFav(d.fav);const on=st.fav.has(d.fav);
    if(cloud.ok){cloud.counts[d.fav]=Math.max(0,cnt(d.fav)+(on?1:-1));paintCounts();}
    if(on)askVisit(d.fav,true);else{setVisit(d.fav,null);toast('즐겨찾기에서 뺐습니다');}cloudSync();return;}
  if('vpick' in d){askVisit(d.vpick,false);return;}
  if('vday' in d){vpick.day=+d.vday;if(vpick.h!=null&&pastHour(vpick.day,vpick.h)){vpick.h=null;vpick.m=null;}paintPicker();return;}
  if('vap' in d){if(vpick.ap!==d.vap){vpick.ap=d.vap;vpick.h=null;vpick.m=null;}paintPicker();return;}
  if('vhour' in d){vpick.h=+d.vhour;if(vpick.m==null||pastTime(vpick.day,vpick.h,vpick.m))vpick.m=VMINS.find(x=>!pastTime(vpick.day,vpick.h,x))??null;paintPicker();return;}
  if('vmin' in d){vpick.m=+d.vmin;paintPicker();return;}
  if('vsave' in d){const {day,h,m:mi}=vpick;if(h==null||mi==null)return;const k=`${day}-${h}-${mi}`;setVisit(vpick.id,k);$('#modal').hidden=true;toast(`${vlabel(k)} 방문 예정으로 저장했습니다`);return;}
  if('vclear' in d){setVisit(vpick.id,null);$('#modal').hidden=true;toast('방문 시간을 지웠습니다');return;}
  if('vskip' in d){$('#modal').hidden=true;return;}
  if('favsort' in d){st.favSort=d.favsort;render();return;}
  if('seen' in d){toggleSet(st.seen,'seen',d.seen);if(st.org)refreshSheetButtons();else render();return;}
  if('copy' in d){const txt=d.copy;const ok=()=>toast(txt+' 복사했습니다');const no=()=>toast('번호를 길게 눌러 복사하세요');
    try{navigator.clipboard.writeText(txt).then(ok,no);}catch(err){no();}return;}
  if('zoom' in d){$('#lbimg').src=d.zoom;$('#lbcap').textContent=d.cap||'';$('#lb').classList.remove('zoom');$('#lbz').textContent='크게';$('#lb').hidden=false;return;}
  if('close' in d){go(st.tab);return;}
  if('sec' in d){const el=document.querySelector(`#sheet details[data-key="${d.sec}"]`);if(el){el.open=true;el.scrollIntoView({block:'start'});$('#sheet').scrollTop-=56;}return;}
  if('tomap' in d){const o=ORG[d.tomap];const b=D.booths.find(x=>x.o===o.id);st.bld=o.bld;st.spot=b?b.i:null;st.zoom=false;st.tab='map';go('map');window.scrollTo(0,0);return;}
  if('major' in d){st.major=d.major;store.set('major',st.major);closeModal();if(st.org){render();openSheet(st.org);}else render();maybeAskNick();return;}
  if('org' in d){go('o-'+d.org);return;}
  if('tab' in d){st.tab=d.tab;go(d.tab);window.scrollTo(0,0);return;}
  if('cat' in d){st.cat=d.cat;st.q='';render();return;}
  if('metric' in d){st.metric=d.metric;st.sort='val';render();return;}
  if('bld' in d){st.bld=d.bld;st.spot=null;st.zoom=false;render();window.scrollTo(0,0);return;}
  if('spot' in d){const i=+d.spot,fromList='fromlist' in d;st.spot=(st.spot===i&&!fromList)?null:i;render();if(fromList)scrollToPlan();return;}
  if('zoomplan' in d){st.zoom=!st.zoom;render();return;}
  if('favview' in d){st.favView=d.favview;render();return;}
  if('cg' in d){st.cg=d.cg;render();return;}
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){st.q=e.target.value;const L=listOrgs();const mx=maxOf(st.metric);$('#rows').innerHTML=(st.cat==='ship'?L.map(o=>rowHTML(o,st.metric,mx)).join(''):L.map(agRowHTML).join(''))||'<li class="empty">찾는 이름이 없습니다.</li>';}
  if(e.target.id==='cq'){st.cq=e.target.value;$('#clist').innerHTML=contactList().map(c=>contactRow(c,true)).join('')||'<div class="empty">찾는 연락처가 없습니다.</div>';}
});
document.addEventListener('change',e=>{if(e.target.id==='sort'){st.sort=e.target.value;render();}});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='btext'){const c=$('#bcnt');if(c)c.textContent=t.value.length+'/200';}
  if(t.classList&&t.classList.contains('ctext')){board.draft[+t.dataset.ctext]=t.value;grow(t);}
  if(t.id==='npin'){const v=t.value.replace(/\D/g,'').slice(0,4);if(v!==t.value)t.value=v;}});
document.addEventListener('toggle',e=>{if(e.target.classList&&e.target.classList.contains('cpd'))st.cmpMore=e.target.open;},true);
document.addEventListener('submit',e=>{const f=e.target;if(f.id==='bform'){e.preventDefault();sendPost();}else if(f.id==='nform'){e.preventDefault();saveNick();}else if(f.dataset&&f.dataset.cform){e.preventDefault();sendComment(+f.dataset.cform);}});
$('#majbtn').addEventListener('click',()=>askMajor(false));
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'&&st.major&&panelMode!=='nick')closeModal();});
$('#modebtn').addEventListener('click',()=>setMode(document.documentElement.dataset.mode==='dark'?'light':'dark'));
$('#lbx').innerHTML=IC.x;$('#lbx').addEventListener('click',()=>{$('#lb').hidden=true;$('#lbimg').removeAttribute('src');});
$('#lbz').addEventListener('click',()=>{const z=$('#lb').classList.toggle('zoom');$('#lbz').textContent=z?'화면에 맞추기':'크게';});
$('#lbimg').addEventListener('click',()=>$('#lbz').click());
window.addEventListener('hashchange',route);
setMode(store.get('mode','light'));

fetch('data.json').then(r=>{if(!r.ok)throw new Error(r.status);return r.json();}).then(d=>{
  D=d;for(const o of D.orgs)ORG[o.id]=o;SHIP=D.orgs.filter(o=>o.m);AG=D.orgs.filter(o=>o.ag);
  D.booths.forEach((b,i)=>{b.i=i;if(b.o)BORDER[b.o]=i;});
  route();if(!st.major)askMajor(true);cloudStart();
}).catch(err=>{$('#app').innerHTML=`<div class="empty">자료를 불러오지 못했습니다. 화면을 새로 고쳐 주세요.<br><small>${esc(err.message)}</small></div>`;});
</script>
